name: Build Qt 6.8.5 (macOS)

on:
  workflow_dispatch:      # manual trigger, e.g. from the Actions tab
    inputs:
      runner:
        description: Runner image (macos-14 = Apple Silicon, macos-15-intel = Intel)
        type: choice
        options:
          - macos-14
          - macos-15-intel
        default: macos-14

jobs:
  build-qt:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360 

    env:
      ARCH: ${{ inputs.runner == 'macos-14' && 'silicon' || 'intel' }}
      INSTALL_DIR: ${{ github.workspace }}/Qt6.8.5-${{ inputs.runner == 'macos-14' && 'silicon' || 'intel' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cache the downloaded source tarball + extracted tree across runs
      - name: Cache Qt source
        uses: actions/cache@v4
        with:
          path: ~/qt-build
          key: qt-src-6.8.5-${{ env.ARCH }}

      - name: Build Qt
        run: ./macos/build-qt-macos.sh

      # Upload the tarball of the build: $INSTALL_DIR.tar.xz
      - name: Upload built Qt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt 6.8.5 (${{ env.ARCH }})
          path: ${{ env.INSTALL_DIR }}.tar.xz
          retention-days: 5